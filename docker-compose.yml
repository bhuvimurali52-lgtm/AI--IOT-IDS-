services:
  api:
    build: .
    container_name: iot-ids-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  dashboard:
    build: .
    container_name: iot-ids-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    command:
      [
        "streamlit",
        "run",
        "app/dashboard/streamlit_app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    depends_on:
      - api
    restart: unless-stopped
