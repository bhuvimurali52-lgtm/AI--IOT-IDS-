[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-iot-ids"
version = "0.3.0"
description = "AI-Powered IoT Intrusion Detection with real-time anomaly detection dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Academic / educational use" }
authors = [{ name = "AI IoT IDS Project" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.36.0",
  "plotly>=5.22.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "scapy>=2.5.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
